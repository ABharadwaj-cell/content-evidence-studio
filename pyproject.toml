[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "content-evidence-studio"
version = "0.1.0"
description = "Evidence-first marketing tools for ChatGPT and OpenAI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Akhilesh Bharadwaj"}]
dependencies = ["mcp==1.30.0", "openai==2.54.0", "pydantic==2.14.1", "beautifulsoup4==4.15.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.1", "ruff==0.17.2", "pip-audit==2.10.1"]

[project.scripts]
content-evidence-studio = "content_evidence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
